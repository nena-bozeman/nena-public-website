# Production CMS backend — merged with config.base.yml via pnpm cms:build-config.
# Reads/writes the GitHub main branch through the Cloudflare auth proxy.

backend:
  name: github
  repo: nena-bozeman/nena-public-website
  branch: main
  base_url: https://nena-website-edit.nenabozeman.workers.dev
  auth_endpoint: /auth
  # Decap site_id for OAuth — pin to the public site hostname (switch to nenabozeman.org when live).
  site_domain: nena-public-website.nenabozeman.workers.dev
