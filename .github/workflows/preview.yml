name: Deploy Preview
on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy-preview:
    # Dependabot and fork PRs cannot read repository secrets (including CLOUDFLARE_API_TOKEN).
    # CI still validates build + Wrangler dry-runs on those PRs; only the live preview is skipped.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Surfaces the preview URL in the PR sidebar / Deployments UI in addition to the sticky comment.
    environment:
      name: cloudflare-preview
      url: ${{ steps.wrangler.outputs.deployment-url }}
    env:
      PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
      # Match Cloudflare Workers Builds: stable branch alias + per-version preview URL.
      WRANGLER_CI_GENERATE_PREVIEW_ALIAS: "true"
      WORKERS_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Google Calendar sync intentionally omitted — live sync runs in deploy-cloudflare.yml (main) only.
      # Worker + assets project: use Wrangler, not Pages API (no Pages project exists for this app).
      # `versions upload` publishes a preview URL without replacing production traffic.
      # Note: intentionally no `gitHubToken` here — wrangler-action would otherwise post a fresh
      # PR comment on every push. We post/update a single sticky comment ourselves below.
      - name: Upload Worker preview version
        id: wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          packageManager: pnpm

      - name: Extract preview alias URL
        id: preview-urls
        if: steps.wrangler.outputs.deployment-url != ''
        env:
          WRANGLER_OUTPUT: ${{ steps.wrangler.outputs.command-output }}
        run: |
          alias_url=$(
            printf '%s' "$WRANGLER_OUTPUT" \
              | grep -oE 'Version Preview Alias URL: https?://[^[:space:]]+' \
              | sed 's/Version Preview Alias URL: //' \
              | head -1
          )
          echo "alias-url=${alias_url}" >> "$GITHUB_OUTPUT"

      - name: Compose preview comment
        id: preview-comment
        if: github.event_name == 'pull_request' && steps.wrangler.outputs.deployment-url != ''
        env:
          VERSION_URL: ${{ steps.wrangler.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.preview-urls.outputs.alias-url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message="### Preview deployment"
          message="${message}"$'\n\n'"**Version URL (this commit):** ${VERSION_URL}"
          if [ -n "$ALIAS_URL" ]; then
            message="${message}"$'\n'"**Branch URL:** ${ALIAS_URL}"
          fi
          message="${message}"$'\n\n'"Updated for commit \`${COMMIT_SHA}\`."
          {
            echo 'message<<EOF'
            printf '%s\n' "$message"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.wrangler.outputs.deployment-url != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          # `header` keys the comment so subsequent runs update it instead of adding a new one.
          header: preview-deployment
          message: ${{ steps.preview-comment.outputs.message }}
