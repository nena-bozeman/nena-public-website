name: CI

# Required gate for every PR, including Dependabot. Validates install, types, tests,
# production build, internal + external links, and Wrangler packaging without Cloudflare secrets.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  astro-check:
    name: Astro check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:content-references
      - run: pnpm run check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-and-check-internal-links:
    needs: [astro-check, unit-tests]
    runs-on: ubuntu-latest
    env:
      PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1
      - run: pnpm run validate:content-references -- --require-dist
      - run: pnpm run check:internal-links
      # Dry-run both deploy paths without CLOUDFLARE_API_TOKEN (works on Dependabot PRs).
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec wrangler versions upload --dry-run

  check-external-links:
    name: External links
    needs: [build-and-check-internal-links]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Restore lychee cache
        id: restore-lychee-cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          # Include config in the key so stale cached errors are not restored after excludes/accept change.
          key: lychee-${{ hashFiles('.lychee.toml', '.lychee-version') }}-${{ github.sha }}
          restore-keys: lychee-${{ hashFiles('.lychee.toml', '.lychee-version') }}-
      - name: Read lychee version
        id: lychee-version
        run: echo "version=v$(tr -d '[:space:]' < .lychee-version)" >> "$GITHUB_OUTPUT"
      # Pin to commit with 0.24.x tarball subfolder fix (lychee-action#330); @v2.8.0 still expects a flat archive.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: ${{ steps.lychee-version.outputs.version }}
          args: --config .lychee.toml dist/
          fail: true
          jobSummary: true
      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: ${{ steps.restore-lychee-cache.outputs.cache-primary-key }}
